<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perangkat | Wapi XCD</title>

  <!-- Fonts and Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="public/css/style.css" />

  <style>
    /* Basic layout styles to avoid FOUC */
    body {
      display: flex;
      background-color: #f0f2f5;
    }
    .main-content {
      flex-grow: 1;
      transition: margin-left 0.3s ease;
    }
  </style>

  <!-- SweetAlert2 for beautiful popups -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>

  <div class="main-content">

    <div class="container fade-in">
<div class="header">
  <h1>Kelola Perangkat Anda</h1>
    <button id="open-modal-btn" class="btn">Tambah Perangkat Baru</button>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Nama Perangkat</th>
        <th>ID Instans</th>
        <th>Status</th>
        <th>Tindakan</th>
      </tr>
    </thead>
    <tbody id="device-list">
        <tr>
          <td colspan="4" class="text-center">Anda belum memiliki perangkat.</td>
        </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div id="add-device-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">Tambah Perangkat WhatsApp Baru</h2>
      <span class="close-btn">&times;</span>
    </div>
    <div class="modal-body">
      <p id="modal-description">Masukkan nama untuk perangkat Anda dan klik "Hasilkan QR".</p>
      <div id="modal-input-container">
        <input type="text" id="device-name-input" placeholder="contoh: Telepon Bisnis">
        <button id="generate-qr-btn" class="btn">Hasilkan QR</button>
      </div>
      <div id="qr-code-container" style="display: none;">
        <!-- QR Code atau teks memuat akan ditampilkan di sini -->
      </div>
    </div>
  </div>
</div>

</div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="public/js/main.js"></script>
</body>
</html>
